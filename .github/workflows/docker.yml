# Build architecture-specific images without QEMU, then assemble manifests.
# picoflux uses pure-Go SQLite (modernc.org/sqlite), so GOOS/GOARCH cross-
# compilation is sufficient and target runtime stages contain no RUN commands.
name: Docker

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-images:
    name: ${{ matrix.variant }} ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native GitHub runners for the two primary deployment architectures.
          - variant: alpine
            dockerfile: packaging/docker/alpine/Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            tag_suffix: alpine-amd64
          - variant: alpine
            dockerfile: packaging/docker/alpine/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: alpine-arm64
          - variant: distroless
            dockerfile: packaging/docker/distroless/Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            tag_suffix: distroless-amd64
          - variant: distroless
            dockerfile: packaging/docker/distroless/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: distroless-arm64

          # Secondary targets cross-compile with GOARCH/GOARM on amd64. Their
          # runtime stages are COPY-only, so no target emulation is required.
          - variant: alpine
            dockerfile: packaging/docker/alpine/Dockerfile
            platform: linux/arm/v6
            runner: ubuntu-24.04
            tag_suffix: alpine-armv6
          - variant: alpine
            dockerfile: packaging/docker/alpine/Dockerfile
            platform: linux/arm/v7
            runner: ubuntu-24.04
            tag_suffix: alpine-armv7
          - variant: alpine
            dockerfile: packaging/docker/alpine/Dockerfile
            platform: linux/riscv64
            runner: ubuntu-24.04
            tag_suffix: alpine-riscv64
          - variant: distroless
            dockerfile: packaging/docker/distroless/Dockerfile
            platform: linux/arm/v7
            runner: ubuntu-24.04
            tag_suffix: distroless-armv7
          - variant: distroless
            dockerfile: packaging/docker/distroless/Dockerfile
            platform: linux/riscv64
            runner: ubuntu-24.04
            tag_suffix: distroless-riscv64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # Push a deterministic per-architecture tag. The publish job reads these
          # directly from the registry, which avoids the flaky upload/download-artifact
          # round-trip that silently dropped digests (this is how amd64 went missing
          # from the v0.0.14 / latest tags).
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag_suffix }}
          push: true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.tag_suffix }}
          provenance: false

  publish-manifests:
    name: Publish ${{ matrix.variant }} manifest
    needs: build-images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [alpine, distroless]

    steps:
      - name: Generate Docker tags
        id: docker_tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          flavor: |
            suffix=${{ matrix.variant == 'distroless' && '-distroless' || '' }},onlatest=${{ matrix.variant == 'distroless' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify architecture images and push multi-architecture manifest
        env:
          TAGS_JSON: ${{ steps.docker_tags.outputs.json }}
        run: |
          set -euo pipefail

          # Expected per-architecture tags for this variant. Keep in sync with
          # the build-images matrix above. If any architecture build leg is
          # missing, the manifest would silently drop it (this is how amd64 went
          # missing from the v0.0.14 / latest tags), so refuse to publish.
          case "${{ matrix.variant }}" in
            alpine) arch_tags=(alpine-amd64 alpine-arm64 alpine-armv6 alpine-armv7 alpine-riscv64) ;;
            distroless) arch_tags=(distroless-amd64 distroless-arm64 distroless-armv7 distroless-riscv64) ;;
            *) arch_tags=() ;;
          esac

          # Query the registry directly for each expected per-arch image. This
          # replaces the fragile upload/download-artifact round-trip that could
          # silently drop a digest and ship an incomplete manifest.
          missing=()
          for t in "${arch_tags[@]}"; do
            ref="${REGISTRY}/${IMAGE_NAME}:${t}"
            if ! docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
              missing+=("${t}")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing architecture images (would silently drop architectures): ${missing[*]}" >&2
            exit 1
          fi

          mapfile -t tags < <(jq -r '.tags[]' <<<"${TAGS_JSON}")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "${tag}")
          done

          sources=()
          for t in "${arch_tags[@]}"; do
            sources+=("${REGISTRY}/${IMAGE_NAME}:${t}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
