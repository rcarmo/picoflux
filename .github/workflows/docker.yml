# Build architecture-specific images without QEMU, then assemble manifests.
# picoflux uses pure-Go SQLite (modernc.org/sqlite), so GOOS/GOARCH cross-
# compilation is sufficient and target runtime stages contain no RUN commands.
name: Docker

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-images:
    name: ${{ matrix.variant }} ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native GitHub runners for the two primary deployment architectures.
          - variant: alpine
            dockerfile: packaging/docker/alpine/Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            tag_suffix: alpine-amd64
          - variant: alpine
            dockerfile: packaging/docker/alpine/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: alpine-arm64
          - variant: distroless
            dockerfile: packaging/docker/distroless/Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            tag_suffix: distroless-amd64
          - variant: distroless
            dockerfile: packaging/docker/distroless/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: distroless-arm64

          # Secondary targets cross-compile with GOARCH/GOARM on amd64. Their
          # runtime stages are COPY-only, so no target emulation is required.
          - variant: alpine
            dockerfile: packaging/docker/alpine/Dockerfile
            platform: linux/arm/v6
            runner: ubuntu-24.04
            tag_suffix: alpine-armv6
          - variant: alpine
            dockerfile: packaging/docker/alpine/Dockerfile
            platform: linux/arm/v7
            runner: ubuntu-24.04
            tag_suffix: alpine-armv7
          - variant: alpine
            dockerfile: packaging/docker/alpine/Dockerfile
            platform: linux/riscv64
            runner: ubuntu-24.04
            tag_suffix: alpine-riscv64
          - variant: distroless
            dockerfile: packaging/docker/distroless/Dockerfile
            platform: linux/arm/v7
            runner: ubuntu-24.04
            tag_suffix: distroless-armv7
          - variant: distroless
            dockerfile: packaging/docker/distroless/Dockerfile
            platform: linux/riscv64
            runner: ubuntu-24.04
            tag_suffix: distroless-riscv64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.tag_suffix }}
          provenance: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.tag_suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifests:
    name: Publish ${{ matrix.variant }} manifest
    needs: build-images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [alpine, distroless]

    steps:
      - name: Download architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Generate Docker tags
        id: docker_tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          flavor: |
            suffix=${{ matrix.variant == 'distroless' && '-distroless' || '' }},onlatest=${{ matrix.variant == 'distroless' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and push multi-architecture manifest
        env:
          TAGS_JSON: ${{ steps.docker_tags.outputs.json }}
        run: |
          set -euo pipefail

          mapfile -t tags < <(jq -r '.tags[]' <<<"${TAGS_JSON}")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "${tag}")
          done

          sources=()
          while IFS= read -r digest_file; do
            sources+=("${REGISTRY}/${IMAGE_NAME}@sha256:$(basename "${digest_file}")")
          done < <(find /tmp/digests -type f | sort)

          if [[ ${#sources[@]} -eq 0 ]]; then
            echo "No architecture digests were downloaded" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
